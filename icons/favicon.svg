<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1a253c" stroke-width="6"/>
  
  <!-- Subtle center radial ambiance -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)"/>

  <!-- Glowing outer neon ring -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- High-tech grid accent -->
  <path d="M 96 256 L 416 256 M 256 96 L 256 416" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" stroke-dasharray="6,8"/>

  <!-- Precision "W" Monogram + Stochastic Pulse -->
  <g filter="url(#glow)">
    <!-- Main W glyph -->
    <path d="M 128 160 
             L 184 352 
             L 256 220 
             L 328 352 
             L 384 160" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Pulse vertex nodes -->
    <circle cx="128" cy="160" r="10" fill="#00e5ff"/>
    <circle cx="184" cy="352" r="12" fill="#0066ff"/>
    <circle cx="256" cy="220" r="14" fill="#00e5ff"/>
    <circle cx="328" cy="352" r="12" fill="#0066ff"/>
    <circle cx="384" cy="160" r="10" fill="#9d4edd"/>
  </g>

  <!-- Sub-indicator dot -->
  <circle cx="256" cy="408" r="8" fill="#00e676"/>
</svg>
